# CI's profile (.github/workflows/rust.yml and suites.yml). Every failure is
# reported, and the JUnit report feeds the run's test annotations.
[profile.ci]
fail-fast = false
# A hung test ends at 20 x 60s, not at the job's 60 minutes.
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.ci.junit]
path = "junit.xml"

# The tests that exist only in a `ci_clock` build, where the CP0 Count and the
# test device's clock follow retired instructions, so they cannot share a build
# with the rest. Name such a test `ci_clock_...` (after its module path) and
# this profile runs it; no workflow lists tests by name. `cargo ci-clock` runs
# it.
[profile.ci-clock]
default-filter = 'test(/::ci_clock_/)'
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The tests `cargo ci-gpu` runs on a GPU (.github/workflows/wgpu.yml): the
# shared wgpu layer and presenter, and the VPro display through the GPU
# scan-out and the offscreen wgpu renderer, and the IMPACT raster unit against
# its interpreter. The VPro golden scenes stay out: two of them differ from
# their goldens on the GPU unit by one colour step.
[profile.ci-gpu]
default-filter = 'test(/^wgpu::|^dev::odyssey::tests::display::|^dev::mgras::wgpu::/)'
# Each test opens its own device. lavapipe refuses some ("parent device is
# lost") when dozens open at once, as on a many-core host; four, a hosted
# runner's count, pass.
test-threads = 4
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The IMPACT raster tests' first submission builds the raster kernel's
# pipelines, which on lavapipe, Mesa's software Vulkan driver, is CPU-bound
# work. With four of them starting at once next to the rest of the set on a
# four-core runner, three tests' first wait outlasted its 30 s limit in one
# of two runs, and two at a time still timed out once on a pull request run.
# One at a time passed every run (about 145 s for the set).
[[profile.ci-gpu.overrides]]
filter = 'test(/^dev::mgras::wgpu::/)'
test-group = 'mgras-raster'

[profile.ci-gpu.junit]
path = "junit.xml"

# The threaded device tests that the nightly ThreadSanitizer run covers
# (.github/workflows/tsan.yml). Add a test to a device module with one of these
# names and it joins the run; the workflow lists nothing.
#
# Left out, because the sanitizer reports it for a reason that is not a race
# worth chasing in this job:
# - ppmem: its plain read of a word that another thread updates with an atomic
#   is the lock-free design, and the sanitizer reports it on every run.
[profile.tsan]
default-filter = 'test(/ioc3|hub|intx|bridge|isp1040|isp12160/) - test(/ppmem/)'
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The real-device audio tests (`*_on_the_real_device`, see TESTING.md) play
# into the host's one default output: run in parallel, their tones would mix.
[test-groups]
real-audio = { max-threads = 1 }
# The IMPACT raster tests in the ci-gpu profile (see there).
mgras-raster = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/_on_the_real_device$/)'
test-group = 'real-audio'
