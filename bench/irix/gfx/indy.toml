# Indy (IP24, R4400, Newport) on IRIX 6.5.22:
# its desktop golden and a longer Quake timeout, added to steps.toml by run.sh.
#
# The golden was recorded from bench-irix-pr 931c1c826 at 1282x1024 with the
# games disk fitted (its Disk(0,2) icon shows).

[[step]]
name = "gfx/desktop"
unit = "op"
cmd = "sleep 10"
screenshot = "desktop"
golden = "sig1 16x12 1282x1024 "

# Quake's timedemo took 43 minutes at 0.4 fps here, against two minutes on the
# Fuel, so it gets 90 minutes.
[[step]]
name = "gfx/quake"
unit = "op"
requires = "/g/usr/games/sgiquake/quake.gl"
setup = "(sleep 2; DISPLAY=:0 sh /tmp/q.sh) </dev/null >/tmp/q 2>&1 &"
cmd = "until sleep 4; grep -s fps /tmp/ql; do ps -e | grep quake > /dev/null || exit 1; done"
metric = "seconds"
screenshot = "quake"
shot_at = 45
differs_from = "desktop"
timeout = 5400
