# Throwaway: measure decode-table reservations on each host OS. Runs only on
# pushes to the spike branch; delete with the branch.
name: devmap spike

on:
  push:
    branches: [ "spike/devmap-width" ]

permissions:
  contents: read

jobs:
  reserve:
    name: reserve (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm, ubuntu-latest, macos-latest ]
    defaults:
      run:
        shell: bash
        working-directory: spike/devmap
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release
      - name: default plan
        run: ./target/release/devmap-spike
      - name: ceiling at 42 bits
        run: ./target/release/devmap-spike 42 max 200
      - name: ceiling at 43 bits
        run: ./target/release/devmap-spike 43 max 200

  devmap-tests:
    name: iris devmap tests at ${{ matrix.bits }} bits (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bits: [ 40, 42, 43 ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: set PHYS_BITS
        run: |
          sed -i "s/^pub const PHYS_BITS: u32 = 40;/pub const PHYS_BITS: u32 = ${{ matrix.bits }};/" src/ppmem/devmap.rs
          grep -n "pub const PHYS_BITS" src/ppmem/devmap.rs
      - run: rustup show
      - name: ppmem tests
        run: cargo test --lib ppmem -- --test-threads=4
