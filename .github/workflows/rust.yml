name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Runner images match release.yml: ubuntu-24.04 (glibc floor), macos-26 (pinned
# through GitHub's macos-15 -> macos-26 migration; arm64), windows-latest (x64).
# fail-fast is off so one platform breaking still reports the others.
jobs:
  # Default features, every workspace crate, all three host platforms.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04,   informational: false }
          - { name: macos,   os: macos-26,       informational: true }
          - { name: windows, os: windows-latest, informational: true }
    steps:
    - uses: actions/checkout@v5
    # rust-toolchain.toml pins nightly; `rustup show` installs it up front so a
    # toolchain download doesn't land inside the Build step's timing.
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-test-cargo-
    # --workspace, not the default. Without it cargo only builds and tests the
    # root `iris` package, so iris-gui was never compiled here at all and its
    # tests never ran — a GUI-only breakage could not turn this red. It needs no
    # extra system packages: wayland, X11 and GL are dlopen'd at runtime, so the
    # only thing it links is libasound, which is already installed above.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Check REX3 GPU replay
      run: cargo check -p iris --lib --example rex3-gpu-probe --features rex-gpu
    - name: Test REX3 GPU matcher
      if: runner.os == 'Linux'
      run: cargo test -p iris --lib --features rex-gpu rex3_gpu::tests
    # macOS and Windows test results are informational: a failure is reported
    # (red step, annotation on the run) but does not fail the job or the
    # workflow. Shared runners there are slower and noisier, and several tests
    # read the wall clock. Their Build step above still gates; Linux gates on
    # both.
    # The VPro fragment pipeline's SIMD kernels against their scalar
    # formulas, on every level the runner's CPU has (src/dev/odyssey/pipe/
    # lanes.rs): deterministic, so they gate everywhere. macos-26 is the
    # only runner with NEON.
    - name: Run SIMD lane tests
      run: cargo test -p iris --lib the_lane_
    - name: Run tests
      continue-on-error: ${{ matrix.informational }}
      run: cargo test --workspace --verbose

  # The nightly/release CLI feature set (scripts/dist/lib.sh): a build check
  # only, so a platform-specific break in the Cranelift JITs or the lightning
  # interpreter path turns CI red before a nightly does.
  features:
    name: Build release features (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04 }
          - { name: macos,   os: macos-26 }
          - { name: windows, os: windows-latest }
    steps:
    - uses: actions/checkout@v5
    - name: Install pinned toolchain
      run: rustup show
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgl-dev  # hostgl links libGL
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-features-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-features-cargo-
    - name: Build
      run: cargo build --release -p iris --bins --features lightning,jitv2,gpujit,idle-pause,hostgl
    # Reads the binary just built (tools/hot-path-check): no formatting calls
    # in MipsExecutor code outside a short list of cold methods, and no
    # out-of-line copy of a fetch that must inline. It needs this job's build:
    # lightning, because without it step_int keeps the breakpoint and monitor
    # paths, which format by design, and the release profile's fat LTO,
    # without which it fails as unreadable. No run and no timing, so the result
    # is deterministic for a given compiler, but a new nightly can move an
    # inlining decision. Linux fails the job. macOS is informational until a
    # Mach-O run has been checked against Linux. Windows keeps its symbols in
    # the PDB, which the script cannot read.
    - name: Check the interpreter's hot paths
      if: runner.os != 'Windows'
      continue-on-error: ${{ runner.os == 'macOS' }}
      run: |
        (cd tools/hot-path-check && python3 -m unittest)
        python3 tools/hot-path-check/check.py target/release/iris
    - name: Build opt-in REX3 dirty uploads
      run: |
        cargo build -p iris --features rex-dirty-upload
        cargo build -p iris-gui --features rex-dirty-upload
    - name: Test REX3 dirty uploads
      if: runner.os == 'Linux'
      run: |
        cargo test -p iris --test rex3_dirty --features rex-dirty-upload
        cargo test -p iris --lib --features rex-dirty-upload go_damage_classifies_planes_bounds_and_non_writes
        cargo test -p iris --lib --features rex-dirty-upload register_traffic_is_clean_and_draws_publish_selected_plane

  # The distribution scripts run only in nightly and release builds, so lint
  # them here where a mistake shows up on the pull request.
  dist-scripts:
    name: Lint scripts/dist
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - run: shellcheck -x -S warning scripts/dist/*.sh scripts/build-macos.sh
    - name: Version strings
      run: |
        [ "$(scripts/dist/version.sh release v1.2.3)" = 1.2.3 ]
        [ "$(scripts/dist/version.sh nightly 2026-01-05)" = nightly.2026.01.05 ]
        ! scripts/dist/version.sh release v1.2 2>/dev/null
    - name: Release notes render
      run: scripts/dist/release-notes.sh --channel nightly --version nightly.2026.01.05 --tag nightly
