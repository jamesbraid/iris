[package]
name = "sgi-engine"
version = "0.1.0"
edition = "2021"
description = "What an emulator's shell sees of an SGI board engine: the trait, its types and a C ABI"
publish = false

[features]
# Panic injection points for the tests (`inject`).
fault-injection = []
# A small mock board (`mock`), for the board crates' own tests.
mock = []
# `tools/check-header`: cbindgen compares the C header with src/ffi.rs.
header-check = ["dep:cbindgen"]

[dependencies]
log = "0.4"
parking_lot = "0.12"
cbindgen = { version = "0.29", optional = true, default-features = false }

[dev-dependencies]
sgi-engine = { path = ".", features = ["mock", "fault-injection"] }

[[example]]
name = "cbindgen_header"
required-features = ["header-check"]
