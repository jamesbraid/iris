[package]
name = "iris-cpu"
version = "0.1.0"
edition = "2021"
publish = false

# One layer of the iris crate split (layers.toml; generated by scripts/crate-split.py).
# Features mirror the iris package so a cfg inside a shared macro means the
# same thing in every crate; iris forwards each one to all of them, and the
# root Cargo.toml describes them.
[features]
debug_cache = ["iris-core/debug_cache"]
developer = ["gputrace", "iris-core/developer"]
gputrace = ["iris-core/gputrace"]
developer_ip7 = ["iris-core/developer_ip7"]  # CP0 Compare/timer calibration stats and debug prints
developerx = ["iris-core/developerx"]     # Extended developer logging: breaks on IBE/DBE/ADEL/ADES/TLB errors
llstats = ["iris-core/llstats"]
perfetto = ["iris-core/perfetto"]
rexdiag = ["iris-core/rexdiag"]
fetchverify = ["iris-core/fetchverify"]
ci_clock = ["iris-core/ci_clock"]
opcodefusion = ["iris-core/opcodefusion"]
lightning = ["opcodefusion", "iris-core/lightning"]
tlbvmap = ["iris-core/tlbvmap"]
tlbstats = ["iris-core/tlbstats"]
jitstats = ["iris-core/jitstats"]
tlbcheck = ["iris-core/tlbcheck"]
instr_stats = ["iris-core/instr_stats"]
r5ksc = ["iris-core/r5ksc"]
r5ksc_triton = ["r5ksc", "iris-core/r5ksc_triton"]
idle-pause = ["iris-core/idle-pause"]
tcache = ["iris-core/tcache"]
tcache_verify = ["tcache", "iris-core/tcache_verify"]
cache-ecc = ["iris-core/cache-ecc"]
decode-cache = ["iris-core/decode-cache"]
default = ["tlbvmap", "rexdiag"]
rex-jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native", "iris-core/rex-jit"]
gr4-jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native", "iris-core/gr4-jit"]
gr2-jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native", "iris-core/gr2-jit"]
gpujit = ["rex-jit", "gr4-jit", "gr2-jit", "iris-core/gpujit"]
jitv2 = ["tcache", "cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native", "region", "wasmtime-jit-icache-coherence", "iris-core/jitv2"]
jitv2_opcodefusion = ["jitv2", "iris-core/jitv2_opcodefusion"]
j2wp = ["jitv2", "iris-core/j2wp"]
jitv2_lockstep = ["jitv2", "developer", "iris-core/jitv2_lockstep"]
jitv2_smc_check = ["jitv2", "iris-core/jitv2_smc_check"]
pcap = ["iris-core/pcap"]
hostcall = ["dep:iris-hostcall", "iris-core/hostcall"]
hostgl = ["hostcall", "iris-core/hostgl"]
test-support = ["iris-core/test-support"]

[dependencies]
crossbeam-queue = "0.3"
bitfield = "0.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "1.0.3"
blake3 = "1"
parking_lot = "0.12"
gdbstub = { version = "0.7", features = ["std"] }
gdbstub_arch = "0.3"
cranelift-codegen    = { version = "0.134", optional = true }
cranelift-frontend   = { version = "0.134", optional = true }
cranelift-jit        = { version = "0.134", optional = true }
cranelift-module     = { version = "0.134", optional = true }
cranelift-native     = { version = "0.134", optional = true }
region               = { version = "3.0",   optional = true }
wasmtime-jit-icache-coherence = { version = "=47.0.3", optional = true, package = "wasmtime-internal-jit-icache-coherence" }
iris-hostcall = { path = "../../iris-hostcall", optional = true }
iris-core = { path = "../iris-core", default-features = false }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
iris-core = { path = "../iris-core", default-features = false, features = ["test-support"] }
