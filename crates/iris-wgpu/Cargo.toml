[package]
name = "iris-wgpu"
version = "0.1.0"
edition = "2021"
description = "Iris's src/wgpu layer (device, planes, batches, kernels) as a library of its own, for QEMU's SGI GPU code"
publish = false

# The sources are src/wgpu in the iris crate, mounted by lib.rs. The tests
# there exercise REX3 and stay with iris.
[lib]
test = false
doctest = false

[dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
parking_lot = "0.12"
log = "0.4"
# device.rs holds the window system's display handle type. This crate never
# opens a window, but winit refuses to build for Linux without a backend.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
