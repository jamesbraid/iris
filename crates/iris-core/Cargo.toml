[package]
name = "iris-core"
version = "0.1.0"
edition = "2021"
publish = false

# One layer of the iris crate split (layers.toml; generated by scripts/crate-split.py).
# Features mirror the iris package so a cfg inside a shared macro means the
# same thing in every crate; iris forwards each one to all of them, and the
# root Cargo.toml describes them.
[features]
debug_cache = []
developer = ["gputrace"]
gputrace = []
developer_ip7 = []  # CP0 Compare/timer calibration stats and debug prints
developerx = []     # Extended developer logging: breaks on IBE/DBE/ADEL/ADES/TLB errors
llstats = []
perfetto = []
rexdiag = []
fetchverify = []
ci_clock = []
opcodefusion = []
lightning = ["opcodefusion"]
tlbvmap = []
tlbstats = []
jitstats = []
tlbcheck = []
instr_stats = []
r5ksc = []
r5ksc_triton = ["r5ksc"]
idle-pause = []
tcache = []
tcache_verify = ["tcache"]
cache-ecc = []
decode-cache = []
default = ["tlbvmap", "rexdiag"]
rex-jit = []
gr4-jit = []
gr2-jit = []
gpujit = ["rex-jit", "gr4-jit", "gr2-jit"]
jitv2 = ["tcache"]
jitv2_opcodefusion = ["jitv2"]
j2wp = ["jitv2"]
jitv2_lockstep = ["jitv2", "developer"]
jitv2_smc_check = ["jitv2"]
pcap = []
hostcall = []
hostgl = ["hostcall"]
test-support = []

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-utils = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
png = "0.18"
parking_lot = "0.12"
spin = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
