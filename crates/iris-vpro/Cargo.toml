[package]
name = "iris-vpro"
version = "0.1.0"
edition = "2021"
description = "Iris's VPro (Odyssey) raster back end, CPU and GPU, without the board"
publish = false

[lib]
# The tests inside the mounted files drive the whole board and stay with iris.
test = false
doctest = false

[dependencies]
sgi-engine = { path = "../sgi-engine" }
sgi-gpu-core = { path = "../sgi-gpu-core", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
fearless_simd = "0.4.1"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
blake3 = "1"
toml = "1.0.3"
flate2 = "1"

[features]
default = ["wgpu"]
wgpu = ["scanout"]
scanout = []

[dev-dependencies]
sgi-engine = { path = "../sgi-engine", features = ["conformance"] }
